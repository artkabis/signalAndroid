name: Build Android APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
      - 'master'
      - 'develop'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'develop'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | awk '{print $2}' | tr -d '"')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SamsungRemote-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungRemote-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
          body: |
            ## Samsung Remote Control - Version ${{ steps.version.outputs.VERSION }}

            ### 📱 Installation
            1. Téléchargez le fichier APK ci-dessous
            2. Transférez-le sur votre appareil Android
            3. Installez l'application
            4. Assurez-vous que votre téléphone et votre TV Samsung sont sur le même réseau Wi-Fi

            ### ✨ Fonctionnalités
            - Contrôle complet de votre TV Samsung
            - Saisie vocale pour la recherche
            - Interface intuitive Material Design

            ### 📋 Changelog
            Voir les commits pour les détails des modifications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const repo = context.repo;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
              body: `## ✅ APK Build Success!\n\n` +
                    `L'APK a été compilé avec succès! 🎉\n\n` +
                    `📥 **Télécharger l'APK**: [Cliquez ici](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})\n\n` +
                    `1. Cliquez sur le lien ci-dessus\n` +
                    `2. Faites défiler jusqu'à "Artifacts"\n` +
                    `3. Téléchargez "SamsungRemote-APK"\n` +
                    `4. Décompressez le fichier ZIP\n` +
                    `5. Installez l'APK sur votre appareil Android`
            })
